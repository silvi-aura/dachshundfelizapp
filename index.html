        '<div class="grow">'+
          '<h2 style="font-size:1.2rem">'+esc(d.nombre)+'</h2>'+
          '<p class="tiny" style="color:rgba(253,250,243,.75);margin:2px 0 0">'+esc(stageLabel(d.etapa))+' · '+esc(ageText(d))+'</p>'+
        '</div>'+
        '<div class="ring" style="--p:'+pct+'"><span>'+pct+'%</span></div>'+
      '</div>'+
      (racha>1 ? '<p style="margin:14px 0 0;font-family:Lora,serif;font-size:.98rem;color:var(--gold-pale)">🔥 '+racha+' días seguidos cuidándolo</p>' : '')+
    '</div>'+

    (S.dogs.length>1 ? dogSwitcher()+'<div style="height:16px"></div>' : '')+

    sectTitle('Hoy')+
    '<div class="grid-2">'+
      stat(pct+'%','Plan de hoy')+
      stat(checks,'Checklists marcados')+
    '</div>'+

    sectTitle('Esta semana')+
    '<div class="grid-2">'+
      stat(juegos7,'Juegos de olfato')+
      stat(protos,'Protocolos en curso')+
    '</div>'+

    sectTitle('Lectura de la guía')+
    '<div class="card">'+
      '<div class="spread" style="margin-bottom:9px"><span class="small" style="font-weight:500">'+leidos+' de '+items.length+'</span>'+
      '<span class="tiny dim">'+Math.round(leidos/items.length*100)+'%</span></div>'+
      '<div class="bar"><i style="width:'+Math.round(leidos/items.length*100)+'%"></i></div>'+
      '<div class="divider"></div>'+
      '<div class="stack">'+Object.keys(CATS).map(function(c){
        var tot = items.filter(function(i){return i.cat===c;}).length;
        var l = items.filter(function(i){return i.cat===c && S.read.indexOf(i.key)>=0;}).length;
        if(!tot) return '';
        return '<div><div class="spread" style="margin-bottom:4px"><span class="tiny">'+CATS[c].ico+' '+esc(CATS[c].t)+'</span>'+
          '<span class="tiny dim">'+l+'/'+tot+'</span></div>'+
          '<div class="bar navy" style="height:5px"><i style="width:'+Math.round(l/tot*100)+'%"></i></div></div>';
      }).join('')+'</div>'+
      '<button class="btn btn-sm btn-ghost btn-block" data-tab="guia" style="margin-top:14px">Ir a la biblioteca</button>'+
    '</div>'+

    sectTitle('Peso')+
    (pesos>1 ? '<div class="card">'+chartSVG(d.pesos)+
      '<button class="btn btn-sm btn-ghost btn-block" data-go="peso" style="margin-top:11px">Ver el historial</button></div>'
      : '<button class="card tappable card-flat" data-go="peso" style="display:flex;align-items:center;gap:12px">'+
        '<span style="font-size:1.3rem">⚖️</span><span class="grow">'+
        '<span style="display:block;font-weight:500;font-size:.92rem">'+(pesos?'Un registro cargado':'Sin registros de peso')+'</span>'+
        '<span class="tiny dim">Hacen falta dos para ver la evolución</span></span></button>')+

    sectTitle('Últimos juegos')+
    ((d.juegos||[]).length ?
      '<div class="stack">'+d.juegos.slice(0,6).map(function(j){
        var fb = j.fb==='facil'?'😊':j.fb==='dificil'?'🤔':'😐';
        return '<div class="listrow" style="cursor:default"><span style="font-size:1.1rem">'+fb+'</span>'+
          '<span class="grow"><span style="display:block;font-weight:500;font-size:.9rem">Nivel '+j.n+' · '+esc(j.t)+'</span>'+
          '<span class="tiny dim">'+fmtDate(j.fecha)+'</span></span></div>';
      }).join('')+'</div>'
      : '<div class="empty"><div class="ico">🧠</div><p class="small">Todavía no registraste ningún juego.</p></div>')+

    '<p class="tiny dim center" style="margin-top:22px">El progreso mide constancia, no rendimiento. Con esta raza gana la constancia, no la intensidad.</p>';

  return {title:'Progreso', html:html, after:bindSwitcher};
}

function stat(v, l){
  return '<div class="card center">'+
    '<div style="font-family:Lora,serif;font-size:1.7rem;font-weight:600;color:var(--navy);line-height:1.1">'+esc(String(v))+'</div>'+
    '<div class="tiny dim" style="margin-top:3px">'+esc(l)+'</div></div>';
}

/* ============================================================
   NOTAS · RECORDATORIOS · SANIDAD
   ============================================================ */
function viewNotas(){
  var d = dog();
  var html =
    '<button class="btn btn-block" data-add style="margin-bottom:18px">Escribir una nota</button>'+
    (d.notas.length ?
      '<div class="stack">'+d.notas.map(function(n,i){
        return '<div class="card">'+
          '<div class="spread" style="margin-bottom:6px"><span class="tiny dim">'+fmtDate(n.fecha)+'</span>'+
          '<button class="iconbtn" data-del="'+i+'" style="width:28px;height:28px;background:transparent;color:var(--ink-3)">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">'+I.trash+'</svg></button></div>'+
          '<p class="small" style="margin:0;white-space:pre-wrap">'+esc(n.texto)+'</p></div>';
      }).join('')+'</div>'
      : '<div class="empty"><div class="ico">📝</div><p class="small">Sin notas todavía.<br>Anotá lo que vayas observando: sirve muchísimo en la consulta veterinaria.</p></div>');

  return {title:'Notas de '+d.nombre, html:html, after:function(){
    $('[data-add]').addEventListener('click', function(){
      var node = sheet('Nueva nota',
        '<label class="field"><span>Fecha</span><input class="input" id="n-f" type="date" value="'+today()+'"></label>'+
        '<label class="field"><span>Nota</span><textarea class="input" id="n-t" placeholder="Lo que notaste, lo que probaste, lo que funcionó…"></textarea></label>'+
        '<button class="btn btn-block" id="n-go">Guardar</button>');
      $('#n-t',node).focus();
      $('#n-go',node).addEventListener('click', function(){
        var t = $('#n-t',node).value.trim();
        if(!t){ toast('Escribí algo primero'); return; }
        d.notas.unshift({fecha:$('#n-f',node).value||today(), texto:t});
        save(); closeSheet(); toast('Nota guardada'); render();
      });
    });
    $$('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ d.notas.splice(Number(b.dataset.del),1); save(); render(); });
    });
  }};
}

var SUGERIDOS = [
  {t:'Registrar el peso', s:'Una vez por mes', dias:30},
  {t:'Test de las tres zonas', s:'Con las manos, 30 segundos', dias:30},
  {t:'Cortar las uñas', s:'Cada 3 o 4 semanas', dias:25},
  {t:'Baño', s:'Según el tipo de pelo', dias:28},
  {t:'Revisar el arnés', s:'El truco de los dos dedos', dias:60},
  {t:'Control veterinario', s:'Según lo que indique tu veterinario', dias:180}
];

function viewRecordatorios(){
  var d = dog();
  var recs = (d.recordatorios||[]).slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;});
  var html =
    '<button class="btn btn-block" data-add style="margin-bottom:16px">Crear recordatorio</button>'+
    '<p class="tiny dim center" style="margin-bottom:18px">La app no envía notificaciones: te muestra lo próximo cuando la abrís.</p>'+
    (recs.length ?
      '<div class="stack">'+recs.map(function(r,i){
        var vencido = r.fecha < today();
        return '<div class="card'+(vencido?'':' card-flat')+'">'+
          '<div class="spread">'+
            '<span class="grow"><span style="display:block;font-weight:500;font-size:.93rem">'+esc(r.t)+'</span>'+
            '<span class="tiny '+(vencido?'':'dim')+'" style="'+(vencido?'color:var(--brick)':'')+'">'+fmtDate(r.fecha)+' · '+relDays(r.fecha)+'</span></span>'+
            '<button class="btn btn-sm btn-ghost" data-done="'+i+'">Hecho</button>'+
            '<button class="iconbtn" data-del="'+i+'" style="width:30px;height:30px;background:transparent;color:var(--ink-3)">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px">'+I.trash+'</svg></button>'+
          '</div>'+
        '</div>';
      }).join('')+'</div>'
      : '<div class="empty"><div class="ico">🔔</div><p class="small">Sin recordatorios.<br>Abajo tenés algunos sugeridos por la guía.</p></div>')+

    sectTitle('Sugeridos por la guía')+
    '<div class="stack">'+SUGERIDOS.map(function(s,i){
      return '<button class="listrow" data-sug="'+i+'">'+
        '<span class="grow"><span style="display:block;font-weight:500;font-size:.92rem">'+esc(s.t)+'</span>'+
        '<span class="tiny dim">'+esc(s.s)+'</span></span>'+
        '<span class="iconbtn" style="width:28px;height:28px;background:transparent">'+ico('plus')+'</span></button>';
    }).join('')+'</div>'+
    '<div style="margin-top:16px">'+vetNote('Las frecuencias de control veterinario, vacunación y desparasitación las define tu veterinario según tu perro y tu zona.')+'</div>';

  function addRec(t, dias){
    var f = new Date(Date.now()+dias*86400000).toISOString().slice(0,10);
    var node = sheet('Nuevo recordatorio',
      '<label class="field"><span>¿Qué querés recordar?</span><input class="input" id="r-t" value="'+esc(t||'')+'" placeholder="Ej: cortar las uñas"></label>'+
      '<label class="field"><span>Fecha</span><input class="input" id="r-f" type="date" value="'+f+'"></label>'+
      '<button class="btn btn-block" id="r-go">Guardar</button>');
    if(!t) $('#r-t',node).focus();
    $('#r-go',node).addEventListener('click', function(){
      var tt = $('#r-t',node).value.trim();
      if(!tt){ toast('Poné un título'); return; }
      d.recordatorios.push({t:tt, fecha:$('#r-f',node).value||today()});
      save(); closeSheet(); toast('Recordatorio creado'); render();
    });
  }

  return {title:'Recordatorios', html:html, after:function(){
    $('[data-add]').addEventListener('click', function(){ addRec('', 30); });
    $$('[data-sug]').forEach(function(b){
      b.addEventListener('click', function(){ var s = SUGERIDOS[Number(b.dataset.sug)]; addRec(s.t, s.dias); });
    });
    $$('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = recs[Number(b.dataset.del)];
        d.recordatorios = d.recordatorios.filter(function(x){return !(x.t===r.t && x.fecha===r.fecha);});
        save(); render();
      });
    });
    $$('[data-done]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = recs[Number(b.dataset.done)];
        d.recordatorios = d.recordatorios.filter(function(x){return !(x.t===r.t && x.fecha===r.fecha);});
        d.notas.unshift({fecha:today(), texto:'Hecho: '+r.t});
        save(); toast('Listo, lo anoté en las notas'); render();
      });
    });
  }};
}

function viewSanidad(){
  var d = dog();
  var regs = (d.sanidad||[]).slice().sort(function(a,b){return a.fecha<b.fecha?1:-1;});
  var html =
    callout('note','Antes que nada','El esquema de vacunación y de desparasitación lo define tu veterinario según tu perro y tu zona. Esto es un registro para que lo tengas ordenado, no un calendario sanitario.')+
    '<button class="btn btn-block" data-add style="margin:16px 0">Registrar aplicación</button>'+
    (regs.length ?
      '<div class="stack">'+regs.map(function(r,i){
        return '<div class="card">'+
          '<div class="spread" style="margin-bottom:5px">'+
            '<span class="tag '+(r.tipo==='Vacuna'?'tag-teal':'tag-moss')+'">'+esc(r.tipo)+'</span>'+
            '<button class="iconbtn" data-del="'+i+'" style="width:28px;height:28px;background:transparent;color:var(--ink-3)">'+
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">'+I.trash+'</svg></button>'+
          '</div>'+
          (r.detalle?'<div class="small" style="font-weight:500;margin-bottom:3px">'+esc(r.detalle)+'</div>':'')+
          '<div class="tiny dim">Aplicada el '+fmtDate(r.fecha)+
            (r.proxima?' · próxima: '+fmtDate(r.proxima)+' ('+relDays(r.proxima)+')':'')+'</div>'+
        '</div>';
      }).join('')+'</div>'
      : '<div class="empty"><div class="ico">💉</div><p class="small">Sin registros.<br>Anotá lo que ya le aplicaron para tenerlo a mano.</p></div>');

  return {title:'Vacunas y desparasitación', html:html, after:function(){
    $('[data-add]').addEventListener('click', function(){
      var node = sheet('Registrar aplicación',
        '<label class="field"><span>Tipo</span><select class="input" id="s-t">'+
          '<option>Vacuna</option><option>Desparasitación interna</option><option>Desparasitación externa</option><option>Otro</option>'+
        '</select></label>'+
        '<label class="field"><span>Detalle</span><input class="input" id="s-d" placeholder="Ej: quíntuple, antipulgas…"></label>'+
        '<label class="field"><span>Fecha de aplicación</span><input class="input" id="s-f" type="date" value="'+today()+'"></label>'+
        '<label class="field"><span>Próxima (si el veterinario te la indicó)</span><input class="input" id="s-p" type="date"></label>'+
        '<button class="btn btn-block" id="s-go">Guardar</button>');
      $('#s-go',node).addEventListener('click', function(){
        d.sanidad.push({tipo:$('#s-t',node).value, detalle:$('#s-d',node).value.trim(),
          fecha:$('#s-f',node).value||today(), proxima:$('#s-p',node).value});
        save(); closeSheet(); toast('Registro guardado'); render();
      });
    });
    $$('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = regs[Number(b.dataset.del)];
        d.sanidad = d.sanidad.filter(function(x){return x!==r;});
        save(); render();
      });
    });
  }};
}

/* ============================================================
   DISPATCHER
   ============================================================ */
function renderTab(tab){
  switch(tab){
    case 'soluciones': return tabSoluciones();
    case 'salchis':    return tabSalchis();
    case 'guia':       return tabGuia();
    case 'progreso':   return tabProgreso();
    default:           return tabInicio();
  }
}

function renderView(view, arg){
  switch(view){
    case 'columna':       return viewColumna();
    case 'emergencia':    return viewEmergencia();
    case 'alimentacion':  return viewAlimentacion();
    case 'peso':          return viewPeso();
    case 'raro':          return viewRaro();
    case 'raro-res':      return viewRaroRes(arg);
    case 'conducta':      return viewConducta(arg);
    case 'ansiedad':      return viewAnsiedad();
    case 'pis':           return viewPis();
    case 'juegos':        return viewJuegos();
    case 'juguetes':      return viewJuguetes();
    case 'ropa':          return viewRopa();
    case 'medidas':       return viewMedidas();
    case 'higiene':       return viewHigiene();
    case 'bano':          return viewBano();
    case 'convivencia':   return viewConvivencia();
    case 'sumar':         return viewSumar();
    case 'celos':         return viewCelos(arg);
    case 'notas':         return viewNotas();
    case 'recordatorios': return viewRecordatorios();
    case 'sanidad':       return viewSanidad();
    case 'favoritos':     return viewFavoritos();
    case 'lector':        return viewLector(arg);
    default:              return tabInicio();
  }
}

/* ---------- arranque ---------- */
route.tab = S.tab || 'inicio';
if(S.dogs.length && !S.activeId) S.activeId = S.dogs[0].id;

// recalcular la etapa si el perro cumplió años y no fue puesta a mano
S.dogs.forEach(function(d){
  if(d.nacimiento && !d.etapaManual){
    var m = monthsFromBirth(d.nacimiento);
    if(m!==null){ d.meses = m; var st = stageFromMonths(m); if(st) d.etapa = st; }
  }
});
save();

render();

})();

</script>
