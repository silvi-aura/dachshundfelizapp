<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dachshund Feliz">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B2A44'/%3E%3Ctext y='70' x='50' font-size='54' text-anchor='middle'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">

<title>Dachshund Feliz</title>
<meta name="description" content="Más que una guía. Tu compañero para cuidar, entender y disfrutar a tu salchi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DACHSHUND FELIZ — sistema de diseño
   Paleta tomada de los PDF de la marca:
   navy #1B2A44 · oro #8B6914 · marfil #FDFAF3 · tinta #2A2A28
   Acentos de los bonos: teal #2A5462 · musgo #41562F
   ============================================================ */
:root{
  --navy:#1B2A44;
  --navy-2:#24375A;
  --navy-soft:#41527A;
  --gold:#8B6914;
  --gold-2:#B08A28;
  --gold-pale:#E8D9AE;
  --ivory:#FDFAF3;
  --ivory-2:#F6F0E2;
  --sand:#EFE5CE;
  --ink:#2A2A28;
  --ink-2:#5A574E;
  --ink-3:#8A857A;
  --line:#E2D8C2;
  --teal:#2A5462;
  --moss:#41562F;
  --brick:#9B2C1F;
  --brick-soft:#FBEDE9;
  --amber-soft:#FBF3E0;
  --white:#FFFFFF;

  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --sh-1:0 1px 2px rgba(27,42,68,.05), 0 2px 8px rgba(27,42,68,.05);
  --sh-2:0 2px 6px rgba(27,42,68,.07), 0 10px 26px rgba(27,42,68,.08);
  --sh-3:0 12px 40px rgba(27,42,68,.16);

  --nav-h:66px;
  --maxw:760px;
  --ease:cubic-bezier(.22,.9,.32,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--ivory);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:'Lora',Georgia,serif;font-weight:600;line-height:1.25;margin:0;color:var(--navy);letter-spacing:-.01em}
h1{font-size:1.72rem}
h2{font-size:1.3rem}
h3{font-size:1.06rem}
h4{font-size:.95rem;font-family:'Poppins';font-weight:600}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--teal)}
ul{margin:0 0 .85em;padding-left:1.15em}
li{margin-bottom:.35em}
:focus-visible{outline:2.5px solid var(--gold-2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- layout ---------- */
#app{min-height:100dvh}
.screen{
  max-width:var(--maxw);margin:0 auto;
  padding:18px 18px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);
}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.hide{display:none !important}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(253,250,243,.93);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px}
.topbar h2{font-size:1.08rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--ivory-2);color:var(--navy);flex:none;
  transition:background .18s var(--ease), transform .18s var(--ease);
}
.iconbtn:hover{background:var(--sand)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:19px;height:19px}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(253,250,243,.95);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.navbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:.62rem;font-weight:500;letter-spacing:.01em;
  transition:color .18s var(--ease);position:relative;
}
.navbtn svg{width:21px;height:21px;transition:transform .28s var(--ease)}
.navbtn.on{color:var(--navy)}
.navbtn.on svg{transform:translateY(-1px) scale(1.06)}
.navbtn.on::before{
  content:"";position:absolute;top:6px;width:22px;height:3px;border-radius:2px;background:var(--gold);
  animation:navdot .32s var(--ease);
}
@keyframes navdot{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}

/* desktop sidebar */
@media (min-width:900px){
  :root{--nav-h:0px}
  body{padding-left:242px}
  .bottomnav{
    top:0;right:auto;width:242px;height:100dvh;border-top:0;border-right:1px solid var(--line);
    background:var(--ivory-2);padding:26px 14px;
  }
  .bottomnav-inner{grid-template-columns:1fr;height:auto;gap:4px;align-content:start}
  .bottomnav-inner::before{
    content:"Dachshund Feliz";display:block;font-family:'Lora',serif;font-size:1.12rem;
    color:var(--navy);font-weight:600;padding:0 12px 20px;letter-spacing:-.01em;
  }
  .navbtn{flex-direction:row;justify-content:flex-start;gap:13px;font-size:.86rem;padding:11px 12px;border-radius:var(--r-s)}
  .navbtn.on{background:var(--white);box-shadow:var(--sh-1)}
  .navbtn.on::before{top:auto;left:0;width:3px;height:22px;border-radius:0 2px 2px 0}
  .screen{padding-bottom:40px}
  .topbar{padding-top:14px}
}

/* ---------- cards ---------- */
.card{
  background:var(--white);border-radius:var(--r-m);padding:16px;
  box-shadow:var(--sh-1);border:1px solid rgba(226,216,194,.7);
}
.card-tight{padding:13px}
.card-flat{background:var(--ivory-2);box-shadow:none;border-color:var(--line)}
.tappable{
  transition:transform .16s var(--ease), box-shadow .16s var(--ease);
  text-align:left;width:100%;display:block;
}
.tappable:hover{box-shadow:var(--sh-2)}
.tappable:active{transform:scale(.985)}

.hero{
  background:linear-gradient(152deg,var(--navy) 0%,var(--navy-2) 58%,#2E4165 100%);
  color:var(--ivory);border-radius:var(--r-l);padding:20px;position:relative;overflow:hidden;
  box-shadow:var(--sh-2);
}
.hero::after{
  content:"";position:absolute;right:-56px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(176,138,40,.30),transparent 68%);
}
.hero h1,.hero h2,.hero h3{color:var(--ivory)}

/* ---------- type helpers ---------- */
.eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.serif{font-family:'Lora',serif}
.lead{font-size:1.02rem;color:var(--ink-2);line-height:1.62}
.sect-title{display:flex;align-items:baseline;gap:9px;margin:26px 0 11px}
.sect-title:first-child{margin-top:4px}
.sect-title h2{flex:none}
.sect-title .rule{flex:1;height:1px;background:var(--line)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:var(--r-xl);font-weight:600;font-size:.92rem;
  background:var(--navy);color:var(--ivory);
  transition:transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
  box-shadow:0 3px 12px rgba(27,42,68,.2);
}
.btn:hover{background:var(--navy-2);box-shadow:0 5px 18px rgba(27,42,68,.26)}
.btn:active{transform:scale(.965)}
.btn-gold{background:var(--gold);box-shadow:0 3px 12px rgba(139,105,20,.26)}
.btn-gold:hover{background:var(--gold-2)}
.btn-ghost{background:transparent;color:var(--navy);box-shadow:none;border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--ivory-2);box-shadow:none}
.btn-sm{padding:9px 15px;font-size:.82rem}
.btn-block{display:flex;width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 14px;border-radius:var(--r-xl);background:var(--ivory-2);
  border:1.5px solid var(--line);font-size:.82rem;font-weight:500;color:var(--ink-2);
  transition:all .16s var(--ease);
}
.chip:hover{border-color:var(--gold-pale)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--ivory)}
.chip:active{transform:scale(.95)}
.tag{
  display:inline-block;padding:3px 10px;border-radius:var(--r-xl);
  font-size:.68rem;font-weight:600;letter-spacing:.02em;
  background:var(--sand);color:var(--gold);
}
.tag-teal{background:#E3EDF0;color:var(--teal)}
.tag-moss{background:#E8EDE1;color:var(--moss)}
.tag-brick{background:var(--brick-soft);color:var(--brick)}
.tag-navy{background:#E4E8F0;color:var(--navy)}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;padding:12px 14px;border-radius:var(--r-s);
  border:1.5px solid var(--line);background:var(--white);
  transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
}
.input:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(176,138,40,.13)}
textarea.input{min-height:92px;resize:vertical;line-height:1.55}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235A574E' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:17px;padding-right:38px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- checklist ---------- */
.check{
  display:flex;align-items:flex-start;gap:12px;padding:13px 14px;width:100%;text-align:left;
  background:var(--white);border:1px solid rgba(226,216,194,.75);border-radius:var(--r-s);
  transition:background .18s var(--ease), border-color .18s var(--ease);
}
.check:hover{border-color:var(--gold-pale)}
.check + .check{margin-top:8px}
.check .box{
  width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line);
  display:grid;place-items:center;margin-top:1px;
  transition:background .22s var(--ease), border-color .22s var(--ease), transform .22s var(--ease);
}
.check .box svg{width:13px;height:13px;stroke:var(--white);stroke-width:3.4;opacity:0;transform:scale(.4);transition:all .22s var(--ease)}
.check.done{background:var(--ivory-2)}
.check.done .box{background:var(--moss);border-color:var(--moss)}
.check.done .box svg{opacity:1;transform:scale(1)}
.check.done .ctext{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.check .ctext{font-size:.9rem;line-height:1.45}
.check .csub{font-size:.76rem;color:var(--ink-3);margin-top:2px;line-height:1.4}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.check.justdone .box{animation:pop .34s var(--ease)}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:4px;background:var(--sand);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .6s var(--ease)}
.bar.navy > i{background:linear-gradient(90deg,var(--navy-soft),var(--navy))}
.bar.moss > i{background:linear-gradient(90deg,#6A8A4C,var(--moss))}
.ring{--p:0;width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%), rgba(255,255,255,.2) 0);
  transition:background .6s var(--ease);}
.ring > span{width:42px;height:42px;border-radius:50%;background:var(--navy);display:grid;place-items:center;
  font-size:.74rem;font-weight:600;color:var(--ivory);font-family:'Poppins'}

/* ---------- dog avatar ---------- */
.avatar{
  width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;
  background:var(--sand);display:grid;place-items:center;
  font-family:'Lora',serif;font-size:1.22rem;color:var(--gold);font-weight:600;
  border:2px solid rgba(255,255,255,.35);overflow:hidden;
}
.avatar.lg{width:78px;height:78px;font-size:1.8rem}
.avatar.sm{width:38px;height:38px;font-size:.95rem}
img.avatar{display:block}

/* ---------- grids ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (min-width:620px){.grid-auto{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}}

.solcard{
  background:var(--white);border:1px solid rgba(226,216,194,.75);border-radius:var(--r-m);
  padding:14px 13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:104px;
  transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
}
.solcard:hover{box-shadow:var(--sh-2);border-color:var(--gold-pale)}
.solcard:active{transform:scale(.975)}
.solcard .ico{font-size:1.42rem;line-height:1}
.solcard .t{font-family:'Lora',serif;font-weight:600;font-size:.95rem;color:var(--navy);line-height:1.28}
.solcard .s{font-size:.72rem;color:var(--ink-3);line-height:1.35;margin-top:auto}

/* ---------- callouts ---------- */
.callout{border-radius:var(--r-m);padding:14px 15px;font-size:.87rem;line-height:1.55;border-left:4px solid}
.callout h4{margin-bottom:5px;font-size:.84rem;letter-spacing:.01em}
.co-note{background:var(--amber-soft);border-color:var(--gold-2);color:#6A5211}
.co-note h4{color:#6A5211}
.co-alert{background:var(--brick-soft);border-color:var(--brick);color:#7A2418}
.co-alert h4{color:var(--brick)}
.co-teal{background:#E9F1F3;border-color:var(--teal);color:#1E3E49}
.co-teal h4{color:var(--teal)}
.co-moss{background:#EBEFE5;border-color:var(--moss);color:#33441F}
.co-moss h4{color:var(--moss)}

.vetnote{
  display:flex;gap:10px;align-items:flex-start;font-size:.78rem;line-height:1.5;
  color:var(--ink-2);background:var(--ivory-2);border:1px dashed var(--line);
  border-radius:var(--r-s);padding:11px 13px;
}
.vetnote svg{width:16px;height:16px;flex:none;margin-top:2px;stroke:var(--ink-3)}

/* ---------- accordion ---------- */
.acc{border:1px solid rgba(226,216,194,.8);border-radius:var(--r-m);background:var(--white);overflow:hidden}
.acc + .acc{margin-top:9px}
.acc-head{display:flex;align-items:center;gap:11px;width:100%;padding:14px;text-align:left}
.acc-head .t{flex:1;font-family:'Lora',serif;font-weight:600;font-size:.97rem;color:var(--navy);line-height:1.3}
.acc-head .cv{width:17px;height:17px;flex:none;stroke:var(--ink-3);stroke-width:2.2;transition:transform .28s var(--ease)}
.acc.open .cv{transform:rotate(180deg)}
.acc-body{padding:0 14px 14px;font-size:.88rem;line-height:1.6;color:var(--ink-2);animation:slidein .28s var(--ease)}
.acc-body h4{color:var(--navy);margin:12px 0 5px}
.acc-body h4:first-child{margin-top:0}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- steps ---------- */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps > li{
  counter-increment:s;position:relative;padding-left:38px;margin-bottom:13px;
  font-size:.88rem;line-height:1.55;color:var(--ink-2);
}
.steps > li::before{
  content:counter(s);position:absolute;left:0;top:-1px;
  width:26px;height:26px;border-radius:50%;background:var(--sand);color:var(--gold);
  display:grid;place-items:center;font-size:.76rem;font-weight:700;font-family:'Poppins';
}
.steps > li strong{color:var(--navy)}

/* ---------- sheet / modal ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:90;background:rgba(27,42,68,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .22s var(--ease);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--ivory);width:100%;max-width:var(--maxw);
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;animation:up .3s var(--ease);box-shadow:var(--sh-3);
}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
@media (min-width:900px){
  .sheet-bg{align-items:center;padding:20px}
  .sheet{border-radius:var(--r-l);max-height:84dvh;padding-bottom:24px}
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);z-index:100;
  background:var(--navy);color:var(--ivory);padding:11px 19px;border-radius:var(--r-xl);
  font-size:.85rem;font-weight:500;box-shadow:var(--sh-3);animation:toastin .34s var(--ease);
  max-width:min(90vw,420px);text-align:center;
}
@keyframes toastin{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + 121px)}}

/* ---------- lector del libro ---------- */
.reader-cover{background:linear-gradient(145deg,var(--navy),var(--navy-2));color:var(--ivory);border-radius:var(--r-l);padding:24px 20px;margin-bottom:16px;box-shadow:var(--sh-2)}
.reader-cover h1,.reader-cover h2,.reader-cover h3{color:var(--ivory)}
.reader-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.reader-page{background:var(--white);border:1px solid rgba(226,216,194,.8);border-radius:var(--r-m);padding:20px 18px;box-shadow:var(--sh-1);font-family:'Lora',Georgia,serif;font-size:1rem;line-height:1.78}
.reader-page p{margin-bottom:1em}
.reader-page h2,.reader-page h3,.reader-page h4{margin:1.25em 0 .55em}
.reader-page h2:first-child,.reader-page h3:first-child{margin-top:0}
.reader-nav{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:30;background:rgba(253,250,243,.96);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r-xl);padding:9px;box-shadow:var(--sh-2);margin-top:14px}
.reader-nav .row{justify-content:space-between}
.reader-progress{font-size:.72rem;color:var(--ink-3);text-align:center;margin-top:6px}
.reader-note{font-family:'Poppins',system-ui,sans-serif;font-size:.82rem;line-height:1.5}
.reader-toc .listrow{min-height:62px}
.reader-search{margin-bottom:12px}
@media (min-width:900px){.reader-page{font-size:1.03rem;padding:28px 30px}.reader-nav{bottom:14px}}

/* ---------- misc ---------- */
.empty{text-align:center;padding:38px 20px;color:var(--ink-3)}
.empty .ico{font-size:2.1rem;margin-bottom:8px;opacity:.6}
.divider{height:1px;background:var(--line);margin:16px 0}

.listrow + .listrow{margin-top:8px}

.stagger > *:nth-child(1){animation-delay:.02s}
.stagger > *:nth-child(2){animation-delay:.06s}
.stagger > *:nth-child(3){animation-delay:.1s}
.stagger > *:nth-child(4){animation-delay:.14s}
.stagger > *:nth-child(5){animation-delay:.18s}
.stagger > *:nth-child(6){animation-delay:.22s}

  if(!iso) return '';

  return p[2].replace(/^0/,'')+'/'+p[1].replace(/^0/,'')+'/'+p[0].slice(2);
}
function daysBetween(a,b){
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function monthsFromBirth(iso){
  if(!iso) return null;
  var n = new Date(), b = new Date(iso);
  if(isNaN(b) || b>n) return null;
  return Math.max(0, (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth()));
}

function stageFromMonths(m){
  if(m===null||m===undefined||m==='') return null;
  m = Number(m);
  if(m < 6) return 'cachorro';
  if(m < 24) return 'adolescente';
  if(m < 84) return 'adulto';
  return 'senior';
}

  senior:{label:'Senior', rango:'más de 7 años'}
};
function stageLabel(k){ return (STAGES[k]||{}).label || '—'; }
function ageText(d){
  if(!d) return '';
  var m = d.meses;
  if(m===null||m===undefined||m==='') return stageLabel(d.etapa);
  m = Number(m);
  if(m<24) return m+' '+(m===1?'mes':'meses');
  var y = Math.floor(m/12), r = m%12;
  return y+' año'+(y>1?'s':'') + (r? ' y '+r+' m':'');

          pasos:['<strong>Redirigí, no retes.</strong> Cuando te muerda la mano, no la saques de golpe ni le grites. Cambiá tu mano por un mordillo apropiado y dejá que muerda eso.','<strong>El "ay" de la inhibición.</strong> Si el mordisco duele, soltá un "¡ay!" agudo y cortá el juego un segundo. Es lo que le haría un hermano de camada: aprende a medir la fuerza de su boca.','<strong>Premiá el momento en que suelta.</strong> Apenas deja de morderte y elige el juguete, festejo y premio.','<strong>Dale mordillos para el dolor.</strong> Un mordillo congelado alivia las encías. Tené varios a mano.'],
          hoy:'Comprá dos o tres mordillos de texturas distintas y dejá uno en el freezer. Cada vez que vaya a tu mano, cambiala por el mordillo. Repetición, no reto.'},
        adolescente:{sub:'La mordida fuerte y las ganas de romper', x:'Ya no es dentición pura, pero todavía tiene una necesidad grande de masticar y una boca más fuerte. Es la edad de canalizar.',
          pasos:['<strong>Masticables resistentes y seguros</strong>, del tamaño de su boca, rotados para que no se aburra.','<strong>Ejercicio y juego mental diario</strong> para bajar la energía que si no se descarga en tu sillón.','<strong>Control de impulsos</strong> ("dejá", "soltá") premiado.'],
          hoy:'Un adolescente cansado de cabeza rompe mucho menos. Elegí un juego de olfato del módulo Cuerpo y cabeza y hacelo hoy.'},
        adulto:{sub:'Si destroza, es un mensaje', x:'Un adulto que destroza no está en dentición: te está diciendo algo. Tu trabajo es leer qué. El error más común es tratar el síntoma sin leer la causa.',
          pasos:['<strong>Destroza estando vos en casa</strong> → aburrimiento o falta de gasto. Más ejercicio y más juego de olfato diario.','<strong>Destroza tu ropa, tus cosas con tu olor</strong> → búsqueda de cercanía. Dale una prenda vieja tuya como objeto de consuelo y trabajá su seguridad.','<strong>Destroza SOLO cuando te vas</strong> → probablemente no es destructividad, es ansiedad por separación. El abordaje es completamente distinto.'],
          hoy:'Antes de "corregir el destrozo", preguntate: ¿rompe con vos presente o solo cuando te vas? Esa sola pregunta define si el problema es aburrimiento (fácil) o ansiedad (otro protocolo).'},
        senior:{sub:'Un destrozo nuevo prende una luz', x:'Si tu salchi viejo, que nunca rompía nada, de golpe empieza a destrozar o a mordisquear, no lo tomes como maña.',
          pasos:['Puede ser ansiedad nueva, malestar, o un signo de deterioro cognitivo (la "demencia" del perro mayor).','<strong>Primero al veterinario, siempre</strong>, antes de asumir que "se puso rebelde de viejo".'],
          vet:true}
      }
    },
    ladridos:{
      t:'Ladridos', ico:'🔊',
      intro:'Tu salchi ladra por herencia, no por defecto. Lo criaron para rastrear bajo tierra y avisar a los gritos dónde estaba la presa. Está entre las razas que más ladran, y eso es genético. El objetivo nunca es apagarle la voz: es bajar el volumen y encauzarlo.',
      nota:'Antes de cualquier técnica, identificá qué tipo de ladrido es: territorial (alguien pasa), de alarma (ruido raro), de atención (te quiere a vos), por aburrimiento (le sobra energía) o por ansiedad (solo cuando te vas).',
      etapas:{
        cachorro:{sub:'No le enseñes sin querer a ladrar', x:'En esta etapa se previene. El error clásico: el cachorro ladra pidiendo atención, y vos —para que pare— lo alzás o le hablás. Acabás de enseñarle que ladrar funciona.',
          pasos:['<strong>Atención cuando está callado</strong>, nunca justo cuando ladra por pedirte.','<strong>Socializá los disparadores</strong> (ruidos, timbre, gente) mientras el cerebro todavía acepta lo nuevo sin miedo.'],
          hoy:'Hoy, cada vez que esté callado y tranquilo, andá vos y premialo. Es la jugada que previene años de ladrido de atención.'},
        adolescente:{sub:'Nombrá el disparador y ofrecé un plan B', x:'Ahora ya podés enseñarle qué hacer en vez de ladrar. No le estás prohibiendo, le estás dando algo mejor para hacer.',
          pasos:['Cuando aparece el disparador (alguien en la ventana), pedile una conducta alternativa que le pague: <strong>"mirame"</strong> o <strong>"a tu lugar"</strong>.','<strong>Premio grande</strong> cuando elige eso en lugar de ladrar.'],
          hoy:'Elegí hoy tu conducta alternativa ("mirame" o "a tu lugar") y practicala diez veces sin disparador, para que la tenga lista cuando la necesites.'},
        adulto:{sub:'El protocolo de las fases', x:'Con el adulto que ya tiene el hábito instalado, hace falta un plan ordenado.',
          pasos:['<strong>Identificá el disparador exacto.</strong> ¿Ladra a la gente por la ventana? ¿Al timbre? ¿Cuando le sobra energía a la tarde? Anotá una semana qué pasa antes de cada ladrido.','<strong>Reducí la exposición.</strong> Si es la ventana, film o una cortina que le corte la vista a la calle baja los ladridos sin que hagas nada más.','<strong>No lo reforcés.</strong> No le grites (para él, gritar es "vos también ladrás") ni le des lo que pide para callarlo.','<strong>Premiá el silencio y enseñá "silencio".</strong> Cuando para, aunque sea un segundo, marcá y premiá. Con repetición podés poner la palabra a ese momento de calma.','<strong>Cansalo, cuerpo y cabeza.</strong> Un salchi con energía gastada ladra mucho menos.'],
          hoy:'Empezá hoy por el paso 1: anotá qué pasó justo antes de cada ladrido. Una semana de registro vale más que un mes de intentos.'},
        senior:{sub:'Ladridos nuevos, sobre todo de noche', x:'Ojo especial acá.',
          pasos:['Si tu salchi mayor empieza a ladrar de una forma nueva —sobre todo de noche, o desorientado, mirando la pared— puede ser deterioro cognitivo o una molestia física, no maña.','<strong>Es motivo de consulta veterinaria, no de reto.</strong>'],
          vet:true}
      }
    },
    soledad:{
      t:'Ansiedad por separación', ico:'😢',
      intro:'Este es el que más culpa carga, y el que más se confunde. Lo primero, la distinción que ordena todo.',
      nota:'Aburrimiento no es ansiedad por separación. El aburrido se entretiene con un buen juguete y para de romper. La ansiedad de verdad es pánico a quedarse solo: arranca apenas te vas (en los primeros 5 a 20 minutos), muchas veces con agitación antes de que salgas, y aparecen cosas más fuertes — destrozos en la puerta, salivación, hacerse encima estando ya enseñado, intentos de escape.',
      etapas:{
        cachorro:{sub:'Todo es prevención (y es la parte fácil)', x:'Acá tenés el mayor poder de toda tu vida con este perro: enseñarle a estar solo desde el día uno. Es muchísimo más fácil prevenir que curar.',
          pasos:['<strong>Ratos solo aun estando vos en casa.</strong> Que se acostumbre a que a veces estás en otra habitación y no pasa nada.','<strong>No lo trates como un bebé.</strong> Alzarlo cada vez que llora y no ponerle ningún límite, que parece amor, le construye inseguridad. La independencia es un regalo, no un abandono.','<strong>Premiá la calma, no el lloriqueo.</strong> Si vas corriendo cada vez que gimotea, le enseñás que gimotear te trae.','<strong>Salidas cortas que se agrandan de a poco.</strong> Te vas dos minutos y volvés como si nada. Después cinco. Sin dramas de despedida ni de reencuentro.'],
          hoy:'Hoy, andate a otra habitación y cerrá la puerta dos minutos. Volvé sin saludarlo. Eso es el paso 1.'},
        adolescente:{sub:'Sostené la independencia', x:'Es la edad en la que muchos aflojan la rutina "porque ya está grande", y ahí reaparece la angustia. Mantener es más fácil que reconstruir.',
          pasos:['Seguí con las salidas graduales.','Seguí premiando la calma.','Seguí sin hacer show al entrar y al salir.'],
          hoy:'No aflojes la rutina de salidas cortas aunque parezca que "ya está". Esta es la etapa donde más se pierde lo ganado.'},
        adulto:{sub:'El protocolo de desensibilización', x:'Si ya está instalada, se trabaja con paciencia y en orden. La clave es la progresión lenta: saltar pasos es la causa número uno de que "no funcione".',
          pasos:['<strong>Desarmá las señales de salida.</strong> Agarrá las llaves y quedate; ponete el saco y sentate. Que esos gestos dejen de anunciar el abandono.','<strong>Microsalidas.</strong> Salí y entrá en segundos. Después en minutos.','<strong>Aumentá el tiempo de a poco</strong> (1 → 3 → 10 → 30 min). Si reaparece la angustia, retrocedés un escalón.','<strong>Entrá y salí sin ceremonia.</strong> Ni despedidas largas ni fiestas al volver.','<strong>Tu ausencia trae algo bueno.</strong> Un juguete relleno que solo aparece cuando te vas.','<strong>Sumá olor y sonido familiar.</strong> Una prenda tuya, la radio prendida.'],
          hoy:'Expectativa honesta: mejoras visibles entre la 2ª y 4ª semana; casos severos, 2 a 3 meses. Si hay pánico fuerte (autolesión, no come, se hace encima), sumá al veterinario o a un especialista en conducta.',
          vet:true},
        senior:{sub:'Puede aparecer o agravarse', x:'En el perro mayor, una ansiedad nueva al quedarse solo puede estar ligada al deterioro cognitivo o a que ve y oye menos y se desorienta.',
          pasos:['Rutina firme.','Su lugar seguro de siempre.','Consulta veterinaria si el cambio es marcado.'],
          vet:true}
      }
    },
    obediencia:{
      t:'Obediencia', ico:'🐾',
      intro:'Esta es la base que sostiene a las otras tres: un salchi que entiende unas pocas órdenes es un salchi más fácil de guiar en todo lo demás.',
      nota:'El método base sirve para toda edad: con un premio en la mano guiás el cuerpo a la posición (para "sentado", subís el premio sobre su nariz hacia atrás y el toto baja solo); apenas la logra, marcás con un "¡muy bien!" y premio; repetís hasta que sale con el gesto; recién ahí le sumás la palabra. Nunca lo empujes ni le fuerces la postura con las manos — además, por su columna, no conviene.',
      etapas:{
        cachorro:{sub:'Empezá ya, cortito y seguido', x:'Podés empezar apenas llega a casa, alrededor de las 8 semanas.',
          pasos:['<strong>Sesiones cortísimas</strong> — 5 a 10 minutos — y varias veces al día, siempre terminando en un logro. Su cabeza es una esponja pero se cansa rápido.','<strong>"Sentado" y "vení"</strong> son los primeros.','El <strong>"vení"</strong> se practica en casa, en un lugar sin distracciones, siempre asociado a algo buenísimo. Nunca lo llames para retarlo.'],
          hoy:'Tres sesiones de cinco minutos hoy, cada una terminando en un acierto.'},
        adolescente:{sub:'La etapa que te va a poner a prueba', x:'Alrededor de los ocho meses, tu salchi que ya sabía sentarse y venir va a hacer como que nunca aprendió nada. Un estudio de la Universidad de Newcastle lo demostró: en plena pubertad los perros ignoran más las órdenes de su propio dueño y son más difíciles de entrenar. Es una fase biológica y se pasa. No hiciste nada mal.',
          pasos:['<strong>No abandones las sesiones.</strong> Justo ahora, más que nunca. Cortas y más seguidas.','<strong>Subí el valor del premio.</strong> Si te ignora por una galletita, pagá con algo que lo vuelva loco.','<strong>Bajá las distracciones.</strong> Volvé a practicar en lugares tranquilos, como cuando era chico.','<strong>Esperá.</strong> Pasa. Sostené, y del otro lado sale el perro adulto que entrenaste.'],
          hoy:'Es la edad en la que más perros terminan en refugios, porque el dueño cree que "salió malo" justo cuando solo necesitaba que le sostuvieran la etapa. No aflojes acá.'},
        adulto:{sub:'Consolidar, generalizar y reeducar', x:'Con el adulto el trabajo es consolidar (que "sentado" funcione también en la plaza, no solo en la cocina) y generalizar a distintos lugares y distracciones.',
          pasos:['Practicá las mismas órdenes <strong>en lugares distintos</strong> y con más distracción de a poco.','¿Adoptaste un adulto que nunca aprendió? <strong>Se puede, y suele ir más rápido de lo que creés</strong>: ya tiene la cabeza para aprender y el cuerpo maduro. Mismo método señuelo-recompensa. No existe el "ya es tarde".'],
          hoy:'Elegí una orden que ya sabe y practicala hoy en un lugar nuevo.'},
        senior:{sub:'Se le puede enseñar, con más paciencia', x:'Sí, a un perro viejo se le enseñan cosas nuevas. Solo que más despacio.',
          pasos:['Más repetición, sesiones más cortas, más pausas.','<strong>Adaptá al cuerpo que tiene:</strong> si oye menos, pasá a señas con la mano en vez de la voz; si ve menos, usá el olfato y el tacto.','Enseñarle cosas nuevas le mantiene la cabeza despierta y ayuda a frenar el deterioro. Nunca es un perro "terminado".'],
          hoy:'Una sesión corta hoy con una seña nueva. La gimnasia mental del senior importa tanto como la física.'}
      }
    }
  }
};

/* ============================================================
   PIS — Bono "Enseñarle dónde: el hábito del pis sin peleas"
   ============================================================ */
var PIS = {
  intro:'No sos vos. No es un perro tonto. Esta raza tarda más en aprender el pis por razones concretas y documentadas, que no dependen de vos.',
  porque:[
    {t:'Tiene cabeza de cazador', x:'Lo criaron para meterse solo en una cueva a decidir sin esperar órdenes. No le alcanza con que vos quieras que haga en un lugar: necesita que ese lugar le cierre a él.'},
    {t:'Tiene la vejiga chica', x:'Aguanta menos que un perro más grande, simplemente porque es más chico. Necesita más salidas, más seguidas. No es que "no le importa": es anatomía pura.'},
    {t:'Tiene la panza al ras del piso', x:'Cuando el pasto está húmedo o hace frío, su pancita lo siente todo. Por eso muchos salchis se plantan en la puerta y terminan aguantándose hasta hacerse adentro. Los ingleses le dicen wet belly. No es capricho: es incomodidad real.'}
  ],
  mito:{t:'"Se hace pis adentro para vengarse."', x:'No. Un perro no planifica venganzas. Si se hizo adentro es por una de dos razones: todavía no controla del todo la vejiga (es cuestión de edad), o nadie le marcó con claridad cuál es el lugar correcto. Ninguna de las dos es maldad.'},
  bases:[
    {t:'Un lugar fijo, siempre el mismo', x:'El perro se guía por su propio olor: donde ya hizo una vez, algo en su cabeza le dice "el baño es acá". Ese olor es su GPS. Si movés el lugar cada dos días, le borrás el mapa.'},
    {t:'Una rutina pegada a los momentos predecibles', x:'Al despertar, después de comer, después de tomar agua, después de jugar y al salir de la siesta. En esos momentos, llevalo vos. No esperes que avise: todavía no sabe avisar.'},
    {t:'Premio en el instante exacto, en el lugar', x:'Apenas termina de hacer en el punto correcto: festejo, premio y "¡muy bien!" ahí mismo, no cuando volvés adentro. Tienen que quedarle pegadas tres cosas al mismo tiempo: este lugar + esta acción + esto bueno que pasó.'},
    {t:'Supervisión y confinamiento', x:'Un accidente que no pasó es un problema que no tenés. Mientras el hábito se forma, no lo dejes suelto y sin vigilar por toda la casa. Cuando no lo podés mirar, va a un espacio chico y controlado.'}
  ],
  regla:{t:'La regla de los 10 aciertos', x:'Por cada pis en el lugar equivocado, hacen falta alrededor de 10 aciertos en el lugar correcto para reparar el aprendizaje. Un solo accidente en la alfombra te hace retroceder diez pasos. Por eso evitar el accidente no es un detalle: es lo que hace que todo avance rápido o se estanque.'},
  horas:'Para calcular cada cuánto sacarlo hay una regla práctica: edad en meses + 1 = las horas que aguanta. Un cachorro de 3 meses aguanta unas 4 horas. Uno de 2 meses, unas 3. Ojo: un cachorro muy chiquito, apenas llegado, puede necesitar salir cada 20-30 minutos y a los pocos minutos de comer.',
  metodos:[
    {id:'A', t:'Afuera, en un punto fijo', si:'Casa con patio o vereda a mano, y alguien bastante presente las primeras semanas para respetar los horarios.', no:'Si vivís en un piso alto sin ascensor rápido, si trabajás afuera todo el día, o si tu salchi se planta con el frío.', ventaja:'El hábito "ideal", y la casa limpia.', contra:'Sufre con el clima y con el departamento.',
      pasos:['Elegí un punto del patio o la vereda y llevalo siempre ahí, con correa, en cada uno de los momentos predecibles.','Quedate en el lugar, aburrida, sin jugar ni pasear todavía. Esperá a que haga.','Apenas hace: fiesta en el acto, premio y palabra-clave, ahí mismo.','Recién ahí, si querés, un ratito de paseo o juego como bonus.'],
      truco:'Llevá al punto un poco de su propio olor —un pedacito de empapador usado— o usá un spray atrayente. Le marca "el baño es acá" más rápido. Y ojo: si paseás primero, aprende a aguantar para estirar la caminata.'},
    {id:'B', t:'Empapador o zona de interior', si:'Departamento, ausencias largas, cachorro sin vacunas completas, o clima hostil buena parte del año.', no:'Si tu objetivo firme es que haga siempre afuera y tenés cómo sostenerlo.', ventaja:'Práctico, no dependés de salir.', contra:'Mal usado consolida el "adentro".',
      pasos:['Un solo sitio, siempre el mismo, lejos de su cama y de su comida. Ningún perro quiere ensuciar donde come o duerme: usá eso a favor.','Al principio, cubrí un área grande con varios empapadores. Es más fácil que acierte si el blanco es grande.','Llevalo ahí en los momentos clave y premiá cada acierto en el instante.','Achicá de a poco. Cada semana, sacá un empapador y reducí el área, hasta dejar uno solo en el punto definitivo.'],
      truco:'Mal manejado, el empapador puede confundirse con la alfombra, el felpudo o la toalla que dejaste en el piso: para él, textura parecida = mismo permiso. Mantenelo SIEMPRE en el mismo lugar y no dejes telas parecidas tiradas mientras aprende.'},
    {id:'C', t:'Parche de césped o caja', si:'Balcón o patio chico, y sobre todo el salchi que no quiere salir con frío o lluvia.', no:'Si el espacio o el presupuesto no dan, o si el tamaño no le encaja.', ventaja:'Baño techado, y aprovecha el instinto de hacer sobre pasto.', contra:'Costo y espacio; hay que cuidar la medida.',
      pasos:['Igual que el empapador: lugar fijo, llevarlo en los horarios, premio en el acto. Solo cambia la superficie.','Ideal como plan B del clima: tiene su "baño techado" y no depende de que pare de llover.'],
      truco:'Los parches de césped suelen estar pensados para perros de hasta unos 6,8 kg, con medidas típicas de alrededor de 40×60 cm. Para un salchi mini encaja perfecto; el estándar queda en el límite alto, así que fijate bien la medida antes de comprar.'},
    {id:'D', t:'Combinar y transicionar', si:'Hoy no podés sacarlo (le faltan vacunas, tus horarios no dan), pero tu meta es que a futuro haga en la calle.', no:'Si no tenés claro cuál es el método principal.', ventaja:'Bien hecho, suele dar el resultado más rápido de todos.', contra:'Confunde si no hay método principal claro.',
      pasos:['Empezá con el empapador bien establecido (Método B).','Cuando ya acierta seguro, acercá el empapador a la puerta de salida, de a poco, unos centímetros por día.','Cuando el perro madura y completa las vacunas, pasá el empapador afuera, y de ahí al punto fijo exterior. Ya asoció "el baño es sobre esto": solo cambiaste el dónde.'],
      truco:'La clave es siempre la misma: un objetivo por vez, movido de a poco.'}
  ],
  complementos:[
    {t:'La palabra-clave ("hacé pipí")', x:'Sirve para pedirle que haga a demanda: antes de salir, cuando estás apurada, antes de un viaje.',
      pasos:['Elegí una palabra que no uses para otra cosa.','Cada vez que lo veas empezando a hacer en el lugar correcto, decila tranquila, una sola vez.','Premio al terminar, como siempre.'],
      nota:'La mayoría de los perros asocia la palabra con el acto en unos 5 a 10 días. Seguí emparejándola una o dos semanas más para que quede firme.'},
    {t:'La campanita en la puerta', x:'Para el método exterior. Es la que hace que te avise cuando quiere salir.',
      pasos:['Colgá unos cascabeles en la puerta por donde sale, a la altura de su hocico.','Cada vez que lo llevás afuera, hacé sonar la campana con su patita o su nariz antes de abrir.','Premiá. Repetí siempre igual.'],
      nota:'En pocas sesiones, muchos perros aprenden a tocar la campana solos para pedir salir. Parece magia y es pura repetición.'}
  ],
  accidente:{
    mito:{t:'"Si le muestro el pis, o le froto el hocico, aprende que está mal."', x:'Es exactamente al revés. Restregarle el hocico o retarlo después no le enseña "no hagas pis adentro": le enseña "hacer pis delante de mi humano es peligroso". ¿Resultado? Aprende a esconderse para hacer, y encima le podés generar pis de sumisión por miedo.'},
    enacto:'Un "no" tranquilo (no un grito), lo levantás o lo guiás rápido al lugar correcto, y si termina de hacer ahí, premio. Convertiste un accidente en un mini-acierto.',
    despues:'Limpiás y listo. Nada de reto. Para él, tu enojo y el charco de hace diez minutos no tienen ninguna relación.',
    limpieza:'Cuando la orina se seca deja unos cristales que los limpiadores comunes no disuelven. Vos ya no lo olés; tu salchi lo sigue oliendo clarito, y ese olor le grita "el baño es acá". Peor todavía: los productos con amoníaco o lavandina huelen parecido al pis para el perro, así que en vez de borrar la marca, la refuerzan. El limpiador enzimático es el único que digiere ese olor de verdad. Innegociable.',
    senales:'Casi siempre avisa con el cuerpo antes de hacer: olfatea el piso con insistencia, gira en círculos, camina agachado y raso, se inquieta o se aparta. Cuando veas eso, llevalo al lugar correcto antes de que sea tarde.'
  },
  clima:{
    intro:'El salchi que se planta, no quiere salir con frío o lluvia, y se aguanta hasta hacerse adentro. No es que te desafía: es que la está pasando mal.',
    items:['<strong>Abrigalo.</strong> Un piloto impermeable y, si tolera, botitas, cambian por completo su disposición a salir.','<strong>Acompañalo.</strong> No lo mandes solo al patio bajo la lluvia: salí con él, quedate, hacé que valga la pena.','<strong>Premio grande afuera.</strong> Que el que haga con mal clima cobre más que nunca.','<strong>Techá un rincón.</strong> Un punto del patio con techito, donde no le caiga agua encima.'],
    salida:'Si el clima de tu zona es un muro buena parte del año, no te empecines. Resolvé con interior. Eso no es rendirse: es adaptarte a la raza que tenés.'
  },
  adulto:'Suele ser más rápido que con un cachorro: un adulto ya controla la vejiga y ya sabe aprender. Si sos estricta con las cuatro bases —sobre todo con la supervisión— a veces en una sola semana ya ves un progreso claro. Pero ojo con esta distinción: si tu adulto ya sabía y de golpe cambió, empezó a hacerse adentro de un día para el otro o a marcar, eso no es un tema de método. Puede ser algo médico (infección urinaria, cálculos, un tema renal, hormonal o de columna) o un cambio emocional. Primero al veterinario, siempre.',
  tiempos:{
    real:'Contá con 3 a 6 meses para resultados consistentes, y hasta 6 a 9 meses para una fiabilidad plena. Nueve meses no es que algo salió mal: es lo normal para un salchi. Si te dijeron "una semana", te vendieron humo.',

/* ============================================================
   CONVIVENCIA — Bono "Una casa, varios salchis"
   ============================================================ */
var CONVIVENCIA = {
  intro:'Los salchis suelen convivir muy bien entre ellos, sobre todo si son de edad y carácter parecidos. No es que estés jugando a la ruleta: hay una forma de hacerlo bien y otra de hacerlo mal, y la diferencia está en tres cosas — la decisión, la presentación y el manejo del día a día.',
  mitos:[
    {t:'"Uno tiene que ser el alfa."', x:'Está desmentido, y hace rato. Desde 2008 los veterinarios especializados en conducta desaconsejan todo el enfoque de dominancia. Tus salchis funcionan como una familia, con jerarquías flexibles que cambian según la situación. No tenés que imponerte: tenés que ser otra cosa, mucho más útil — el que administra con calma.'},
    {t:'"El primero está celoso del nuevo."', x:'Los perros no sienten celos como nosotros. Lo que ves es una de dos cosas: o está protegiendo un recurso (su comida, su juguete, su lugar, o el acceso a vos), o está compitiendo por tu atención. Importa la diferencia porque los recursos se gestionan y la atención se reparte.'}
  ],
  rol:'No sos el alfa, sos el administrador tranquilo. El que decide quién come dónde, qué juguetes salen y cuándo, y cuánto tiempo a solas recibe cada uno. Tu calma ordena a la manada más que cualquier dominancia.',
  decision:{
    favor:['<strong>Compañía:</strong> si se llevan bien, se hacen aguante cuando no estás, lo que a veces ayuda con la soledad y el aburrimiento.','<strong>Juego y ejercicio</strong> entre ellos.','<strong>Menos destrozos por aburrimiento</strong>, porque se entretienen mutuamente.'],
    contra:['<strong>Todo se multiplica:</strong> comida, veterinario, peluquería.','<strong>Más tiempo y energía</strong>, porque cada uno necesita su atención individual igual.','<strong>Posibilidad de conflictos por recursos</strong> si no manejás bien.','<strong>Algunos perros prefieren ser el único.</strong> Si tu salchi es feliz solo y muy tuyo, no está obligado a querer un hermano.'],
    sexo:'Como tendencia, no como ley: macho + hembra suele ser la combinación de adaptación más fácil y con menos rivalidad. Dos hembras es la que más chances tiene de rivalidad fuerte, y esos conflictos suelen ser los más difíciles de resolver. Con ambos castrados/esterilizados bajan las tensiones.',
    hermanos:{t:'Cuidado con dos cachorros hermanos a la vez', x:'Se lo asocia con más problemas: miedo, reactividad, hiper-apego entre ellos, a veces peleas, sobre todo si son del mismo sexo. Es un tema discutido, pero los problemas en parejas de hermanos están muy vistos en la práctica. Si igual lo hacés, la clave es una: entrenalos y pasá ratos con cada uno por separado.'}
  },
  presentacion:[
    {t:'Terreno neutral, lejos de casa', x:'El primer encuentro NO es en tu casa: para el residente, tu casa es su territorio y lo va a defender. Una persona por perro, cada uno con su correa floja — la correa tensa transmite nervios.'},
    {t:'Caminen juntos antes de tocarse', x:'En vez de ponerlos nariz con nariz de entrada, caminen a la par un rato, en paralelo, dejando que se huelan de a poco sin presión. Compartir una caminata los hace equipo antes de entrar.'},
    {t:'Entrada a casa sin recursos a la vista', x:'Antes de llegar, guardá comederos, juguetes, huesos y camas. Son justo lo que gatilla la guardia y las peleas.'},
    {t:'Acceso gradual', x:'Dejá que el nuevo explore de a ratos cortos (15–20 minutos) mientras el residente está en otro espacio, y andá alternando. Nada de largarlos a los dos y que se arreglen.'},
    {t:'Si ya tenés varios, presentá de a uno', x:'Dos o más residentes juntos tienden a hacer patota contra el recién llegado, y eso lo asusta. Uno por vez, con calma.'}
  ],
  primerosDias:'Los reacomodos de la manada pueden llevar hasta un par de semanas. Va a haber algún gruñido, alguna corrida, algún "che, este es mi lugar". En roces menores, no intervengas: se están ordenando solos, y si saltás a cada gruñido les impedís acomodarse.',
  columna:{t:'Seguridad de columna, siempre', x:'Un encontronazo, un revolcón de juego brusco, o una pelea con un perro más grande puede lastimarle la columna a un salchi en serio. Nunca dejes a tu salchi arreglarse con un perro mucho más grande, y en la manada vigilá que el juego no se vuelva demasiado bestia.'},
  diario:[
    {t:'La comida sin peleas', x:'El momento más explosivo de una manada es la hora de comer. Cada uno su plato, separados y a distancia. Si hay guardia fuerte, dales de comer en ambientes distintos. Retirá las sobras apenas terminan, para que no haya un plato "de nadie" por el que pelear. Nada de bol comunitario.'},
    {t:'Los recursos, administrados por vos', x:'Juguetes de alto valor, huesos, la mejor cama, el lugar del sol: todo eso es un recurso. La solución no es que no tengan nada, es que vos los administres: rotá los juguetes, ofrecé varios lugares de descanso y varios bebederos, y sacá de circulación lo que veas que genera pelea.'},
    {t:'Tu atención: el recurso más disputado sos vos', x:'El gran secreto de una manada tranquila: cada perro necesita su tiempo a solas con vos. Sacá a uno a caminar solo de vez en cuando, tené un rato de mimos individual, entrená con cada uno por separado. Un salchi que tiene su momento tuyo garantizado compite mucho menos por vos el resto del tiempo.'},

  roces:{

    no:'Nunca metas las manos ni el cuerpo entre dos perros peleando, ni les pegues o patees: te muerden sin querer y encima los alterás más.',
    si:'Hacé ruido fuerte (un grito seco, una palmada, algo que caiga), tirá agua, o interponé un objeto (una tabla, un almohadón grande). Si están enganchados y no hay otra, el método carretilla entre dos personas: cada uno agarra a un perro de las patas traseras y camina hacia atrás, sin tironear de las cabezas.',
    despues:'Después de una pelea seria, separalos unos días — las hormonas del estrés tardan en bajar — y reconstruí de a poco, como en la presentación. Si se repite, consultá a un veterinario o a un especialista en conducta.',
    nuevo:'Un roce nuevo entre perros que se llevaban bien merece atención: puede ser un recurso nuevo en disputa, un cambio en la casa, o que uno esté con dolor o enfermo y por eso más irritable. Si dos que convivían en paz empiezan a pelear de la nada, vale una revisión veterinaria.'
  },
  hoy:['Separá los comederos: uno por perro, a distancia (o en cuartos distintos si hay tensión).','Levantá del piso los juguetes u huesos que veas que generan roce, y pasá a dárselos vos de a uno.','Elegí un momento esta semana para sacar o mimar a un salchi a solas. Después, al siguiente.']

/* ============================================================
   SHELL — navegación, bienvenida, perfil
   ============================================================ */
var app = document.getElementById('app');
var layer = document.getElementById('layer');
var route = {tab:'inicio', view:null, arg:null};
var scrollMem = {};

function go(view, arg){
  if(route.view===null) scrollMem[route.tab] = window.scrollY;
  route.view = view; route.arg = arg||null;
  render(); window.scrollTo(0,0);
}
function goTab(tab){
  if(route.view===null) scrollMem[route.tab] = window.scrollY;
  route.tab = tab; route.view = null; route.arg = null;
  S.tab = tab; save(); render();
  window.scrollTo(0, scrollMem[tab]||0);
}
function back(){
  route.view = null; route.arg = null;
  render();
  window.scrollTo(0, scrollMem[route.tab]||0);
}

var NAV = [
  {id:'inicio',    t:'Inicio',      i:'home'},
  {id:'soluciones',t:'Soluciones',  i:'help'},
  {id:'salchis',   t:'Mis salchis', i:'dogs'},
  {id:'guia',      t:'Guía',        i:'book'},
  {id:'progreso',  t:'Progreso',    i:'chart'}
];

function render(){
  if(!S.onboarded || !S.dogs.length){ renderWelcome(); return; }
  document.body.classList.remove('welcomed');
  var v = route.view ? renderView(route.view, route.arg) : renderTab(route.tab);
  app.innerHTML =
    (v.bar!==false ? topbar(v.title, v.actions, !!route.view) : '') +
    '<main class="screen fade-in">'+v.html+'</main>' + navbar();
  bind();
  if(v.after) v.after();
}

function topbar(title, actions, showBack){
  return '<header class="topbar"><div class="topbar-inner">'+
    (showBack ? '<button class="iconbtn" data-back aria-label="Volver">'+ico('back')+'</button>' : '')+
    '<h2>'+esc(title)+'</h2>'+ (actions||'') +
  '</div></header>';
}
function navbar(){
  return '<nav class="bottomnav"><div class="bottomnav-inner">'+
    NAV.map(function(n){
      return '<button class="navbtn'+(route.tab===n.id?' on':'')+'" data-tab="'+n.id+'">'+
        ico(n.i)+'<span>'+n.t+'</span></button>';
    }).join('')+
  '</div></nav>';
}

/* ---------- checklists persistentes por perro ---------- */
function checkState(key, id){
  var d = dog(); if(!d) return false;
  var c = d.checklists[key];
  return !!(c && c[id] === today());
}
function toggleCheck(key, id){
  var d = dog(); if(!d) return;
  if(!d.checklists[key]) d.checklists[key] = {};
  if(d.checklists[key][id]===today()) delete d.checklists[key][id];
  else d.checklists[key][id] = today();
  save();
}
function checklistHTML(key, items){
  return '<div>'+items.map(function(it){
    var on = checkState(key, it.id);
    return '<button class="check'+(on?' done':'')+'" data-ck="'+key+'" data-ckid="'+it.id+'">'+
      '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">'+I.check+'</svg></span>'+
      '<span class="grow"><span class="ctext">'+esc(it.t)+'</span>'+(it.s?'<span class="csub">'+esc(it.s)+'</span>':'')+'</span>'+
    '</button>';
  }).join('')+'</div>';
}
function bindChecklist(root){
  $$('[data-ck]', root||document).forEach(function(b){
    b.addEventListener('click', function(){
      toggleCheck(b.dataset.ck, b.dataset.ckid);
      var on = checkState(b.dataset.ck, b.dataset.ckid);
      b.classList.toggle('done', on);
      if(on){ b.classList.add('justdone'); setTimeout(function(){b.classList.remove('justdone');},400); }
      var counter = document.querySelector('[data-ckcount="'+b.dataset.ck+'"]');
      if(counter) counter.textContent = countChecked(b.dataset.ck);
    });
  });
}
function countChecked(key){
  var d = dog(); if(!d || !d.checklists[key]) return 0;
  return Object.keys(d.checklists[key]).filter(function(k){return d.checklists[key][k]===today();}).length;
}

function planToday(d){
  return (PLAN[d.etapa] || PLAN.adulto);
}
function planDone(d, id){
  return !!(d.plan[today()] && d.plan[today()][id]);
}
function togglePlan(d, id){
  if(!d.plan[today()]) d.plan[today()] = {};
  if(d.plan[today()][id]) delete d.plan[today()][id];
  else d.plan[today()][id] = 1;
  // limpiar días viejos (deja los últimos 60)
  var ks = Object.keys(d.plan).sort();
  while(ks.length>60){ delete d.plan[ks.shift()]; }
  save();
}
function planPct(d){
  var items = planToday(d);
  var n = items.filter(function(x){return planDone(d,x.id);}).length;
  return Math.round(n/items.length*100);
}

/* juego de hoy según la etapa */
function juegoDeHoy(d){
  var pool;
  if(d.etapa==='cachorro') pool = [JUEGOS.niveles[0], JUEGOS.niveles[1]];
  else if(d.etapa==='adolescente') pool = [JUEGOS.niveles[1], JUEGOS.niveles[2], JUEGOS.niveles[4]];
  else if(d.etapa==='senior') pool = [JUEGOS.niveles[0], JUEGOS.niveles[1], JUEGOS.niveles[4]];
  else pool = JUEGOS.niveles.slice(1);
  // rota por día, estable dentro del mismo día
  var seed = Number(today().replace(/-/g,'')) + d.id.length;
  return pool[seed % pool.length];
}

/* próximo recordatorio */
function nextReminder(d){
  var all = (d.recordatorios||[]).concat((d.sanidad||[]).filter(function(s){return s.proxima;}).map(function(s){
    return {t:s.tipo+(s.detalle?' · '+s.detalle:''), fecha:s.proxima, sanidad:true};
  }));
  all = all.filter(function(r){ return r.fecha && r.fecha >= today(); });
  all.sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
  return all[0] || null;
}

        var p = planPct(d);
        var ring = $('.ring'); if(ring){ ring.style.setProperty('--p', p); $('span',ring).textContent = p+'%'; }
        if(p===100) toast('Plan de hoy completo. '+d.nombre+' te lo agradece 🐾');
      });
    });
    $$('[data-plango]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); go(b.dataset.plango, b.dataset.planarg||null); });
    });
    bindSwitcher();
  }};
}

function relDays(iso){
  var n = daysBetween(today(), iso);
  if(n===0) return 'hoy';
  if(n===1) return 'mañana';
  if(n<0) return 'vencido';
  if(n<7) return 'en '+n+' días';
  if(n<31) return 'en '+Math.round(n/7)+' semana'+(n>=14?'s':'');
  return 'en '+Math.round(n/30)+' mes'+(n>=60?'es':'');
}

function chartSVG(ps){
  var pts = ps.slice(-12);
  var W=320, H=150, pad=26;
  var kgs = pts.map(function(p){return p.kg;});
  var min = Math.min.apply(null,kgs), max = Math.max.apply(null,kgs);
  if(max-min < 0.5){ var mid=(max+min)/2; min=mid-0.35; max=mid+0.35; }
  var pd = (max-min)*0.18; min-=pd; max+=pd;
  function x(i){ return pad + i*((W-pad-8)/Math.max(1,pts.length-1)); }
  function y(v){ return 14 + (1-(v-min)/(max-min))*(H-38); }
  var line = pts.map(function(p,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.kg).toFixed(1); }).join(' ');
  var area = line+' L'+x(pts.length-1).toFixed(1)+' '+(H-20)+' L'+x(0).toFixed(1)+' '+(H-20)+' Z';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Evolución del peso">'+
    '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#8B6914" stop-opacity=".18"/><stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<line class="gl" x1="'+pad+'" y1="14" x2="'+(W-8)+'" y2="14"/>'+
    '<line class="gl" x1="'+pad+'" y1="'+((H-20+14)/2)+'" x2="'+(W-8)+'" y2="'+((H-20+14)/2)+'"/>'+
    '<line class="gl" x1="'+pad+'" y1="'+(H-20)+'" x2="'+(W-8)+'" y2="'+(H-20)+'"/>'+
    '<text class="lb" x="2" y="17">'+max.toFixed(1)+'</text>'+
    '<text class="lb" x="2" y="'+(H-17)+'">'+min.toFixed(1)+'</text>'+
    '<path class="ar" d="'+area+'"/>'+
    '<path class="ln" d="'+line+'"/>'+
    pts.map(function(p,i){ return '<circle class="pt" cx="'+x(i).toFixed(1)+'" cy="'+y(p.kg).toFixed(1)+'" r="3.2"/>'; }).join('')+
    '<text class="lb" x="'+pad+'" y="'+(H-4)+'">'+fmtDate(pts[0].fecha)+'</text>'+
    '<text class="lb" x="'+(W-8)+'" y="'+(H-4)+'" text-anchor="end">'+fmtDate(pts[pts.length-1].fecha)+'</text>'+
  '</svg>';
}

function openAbrigoTest(){
  var d = dog();
  var body =
    '<p class="small muted" style="margin-bottom:14px">Contame qué ves. La respuesta la da tu perro, no el termómetro.</p>'+
    '<label class="field"><span>¿Qué temperatura hace, más o menos?</span><select class="input" id="t-temp">'+
      '<option value="0">Menos de 0 °C</option>'+
      '<option value="5">Entre 0 y 10 °C</option>'+
      '<option value="15" selected>Entre 10 y 18 °C</option>'+
      '<option value="22">Más de 18 °C</option>'+
    '</select></label>'+
    '<label class="field"><span>¿Dónde está o va a estar?</span><select class="input" id="t-donde">'+
      '<option value="dentro">Adentro de casa</option>'+
      '<option value="fuera" selected>Afuera, caminando</option>'+
      '<option value="quieto">Afuera, quieto o esperando</option>'+
    '</select></label>'+
    '<div class="field"><span style="display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:8px">¿Qué le ves? Marcá todo lo que aplique</span>'+
      '<div class="chips" id="t-sig">'+
        [['tiembla','Tiembla'],['encoge','Se encoge'],['calor','Busca calor'],['planta','Se planta'],
         ['jadea','Jadea'],['fresco','Busca lugar fresco'],['nada','No le veo nada raro']].map(function(o){
          return '<button class="chip" data-sig="'+o[0]+'">'+o[1]+'</button>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<button class="btn btn-block" id="t-go">Ver el resultado</button>'+
    '<div id="t-res"></div>';

  var node = sheet('¿Necesita abrigo?', body);
  var sig = {};
  $$('[data-sig]',node).forEach(function(b){
    b.addEventListener('click', function(){
      sig[b.dataset.sig] = !sig[b.dataset.sig];
      b.classList.toggle('on', sig[b.dataset.sig]);
    });
  });

  $('#t-go',node).addEventListener('click', function(){
    var temp = Number($('#t-temp',node).value), donde = $('#t-donde',node).value;
    var score = 0, razones = [];

    if(sig.jadea || sig.fresco){
      $('#t-res',node).innerHTML = '<div class="divider"></div>'+
        callout('alert','Probablemente le sobra abrigo',
          'Jadear de forma sostenida y buscar un lugar fresco son las señales de que está de más. El perro no transpira como nosotros: elimina calor jadeando, y una prenda de más se lo impide. Sacásela y dejá que se regule.')+
        '<div style="margin-top:12px">'+vetNote(VET_STD)+'</div>';
      return;
    }

    if(temp<=0){ score+=3; razones.push('Por debajo de 0 °C, un perro chico de pelo corto suele necesitar abrigo.'); }
    else if(temp<=5){ score+=2; razones.push('Muchos salchis ya la pasan mal por debajo de los 10 °C, sobre todo con viento o humedad.'); }
    else if(temp<=15){ score+=1; }

    if(d.etapa==='cachorro'){ score+=2; razones.push('En el cachorro el sistema de regular la temperatura está inmaduro: siente el frío antes y más fuerte que un adulto.'); }
    if(d.etapa==='senior'){ score+=2; razones.push('El salchi mayor genera menos calor, y el frío le empeora la artritis. Su umbral es más bajo que el de un adulto.'); }
    if(d.pelo==='corto'){ score+=1; razones.push('El pelo corto no tiene sub-pelo denso: aísla menos que el largo o el duro.'); }
    if(donde==='quieto'){ score+=1; razones.push('Quieto en la calle siente mucho más el frío que caminando activo.'); }
    if(donde==='dentro'){ score-=2; razones.push('Adentro de casa, con temperatura agradable, no hace falta abrigarlo por costumbre.'); }

    if(sig.tiembla){ score+=3; razones.push('El temblor es la señal más clara: si está sano y hace frío, es por temperatura.'); }
    if(sig.encoge){ score+=2; razones.push('Encogerse y hacerse un bollito es frío real, no teatro.'); }
    if(sig.calor){ score+=2; razones.push('Arrimarse a la estufa, a vos o a la cama es buscar calor.'); }
    if(sig.planta){ score+=2; razones.push('Plantarse en la puerta y resistirse a salir es incomodidad genuina: su panza va a centímetros del suelo frío.'); }

    var si = score>=3;
    $('#t-res',node).innerHTML = '<div class="divider"></div>'+
      callout(si?'teal':'moss',
        si?'Probablemente necesita abrigo':'Probablemente no necesita más abrigo',
        '<ul style="margin:0">'+razones.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>')+
      (si && d.etapa==='senior' ? '<div style="margin-top:11px">'+callout('note','Para el senior','Priorizá prendas que le cubran bien el lomo y la panza, y usá el abrigo también para las caminatas de invierno. Un buen abrigo ayuda a que los músculos no se le tensen.')+'</div>' : '')+
      (sig.tiembla ? '<div style="margin-top:11px">'+callout('alert','Ojo con el temblor', esc(ROPA.alarma))+'</div>' : '')+
      '<div style="margin-top:12px">'+vetNote(VET_STD)+'</div>';
    $('#t-res',node).scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}

function searchIndex(){

  });

  COLUMNA.decalogo.forEach(function(x){ idx.push({t:x[0], s:'Decálogo', x:x[1], go:'columna'}); });
  HIGIENE.errores.forEach(function(e){ idx.push({t:e.t, s:'Higiene · errores', x:e.x, go:'higiene'}); });
  ROPA.porque.forEach(function(p){ idx.push({t:p.t, s:'Ropa y abrigo', x:p.x, go:'ropa'}); });
  CELOS.detonantes.forEach(function(t){ idx.push({t:t.t, s:'Celos · detonante', x:t.sol[0].x, go:'celos', arg:t.id}); });
  CELOS.ejercicios.forEach(function(e){ idx.push({t:e.t, s:'Celos · ejercicio', x:e.uso, go:'celos'}); });
  CONVIVENCIA.diario.forEach(function(x){ idx.push({t:x.t, s:'Convivencia', x:x.x, go:'convivencia'}); });
  Object.keys(CONDUCTA.problemas).forEach(function(k){
    var p = CONDUCTA.problemas[k];
    idx.push({t:p.t, s:'Conducta', x:p.intro, go:'conducta', arg:k});
    Object.keys(p.etapas).forEach(function(s){
      idx.push({t:p.t+' · '+stageLabel(s), s:'Conducta por etapa', x:p.etapas[s].x, go:'conducta', arg:k});

  JUGUETES.forEach(function(t){ idx.push({t:t.t, s:'Juguetes', x:t.x, go:'juguetes'}); });

var _idx = null;
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function searchHTML(q){
  if(!_idx) _idx = searchIndex();
  var nq = norm(q);
  var res = _idx.map(function(i){
    var nt = norm(i.t), nx = norm(i.x||''), ns = norm(i.s||'');
    var score = 0;
    if(nt.indexOf(nq)===0) score = 100;
    else if(nt.indexOf(nq)>=0) score = 70;
    else if(ns.indexOf(nq)>=0) score = 40;
    else if(nx.indexOf(nq)>=0) score = 25;
    return score ? {i:i, score:score} : null;
  }).filter(Boolean).sort(function(a,b){return b.score-a.score;}).slice(0,25);

  if(!res.length) return '<div class="empty"><div class="ico">🔍</div><p class="small">No encontré nada con "'+esc(q)+'".<br>Probá con otra palabra.</p></div>';

  return '<p class="tiny dim" style="margin-bottom:11px">'+res.length+' resultado'+(res.length>1?'s':'')+'</p>'+
    '<div class="stack">'+res.map(function(r){
      var i = r.i;
      var attr = i.go ? 'data-go="'+i.go+'"'+(i.arg?' data-arg="'+i.arg+'"':'') : '';
      return '<button class="card tappable" '+attr+' style="text-align:left">'+
        '<div class="eyebrow" style="margin-bottom:4px">'+esc(i.s)+'</div>'+
        '<div class="serif" style="font-weight:600;color:var(--navy);font-size:.97rem;margin-bottom:4px">'+hl(i.t,q)+'</div>'+
        '<div class="tiny dim" style="line-height:1.45">'+hl(String(i.x||'').slice(0,150)+(String(i.x||'').length>150?'…':''), q)+'</div>'+
      '</button>';
    }).join('')+'</div>';
}
function hl(text, q){
  var nt = norm(text), nq = norm(q), i = nt.indexOf(nq);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
